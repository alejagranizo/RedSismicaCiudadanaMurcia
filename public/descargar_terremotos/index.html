<!DOCTYPE html>
<html lang="en">
<head>
  <title>Visor</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/index.css">
  <!--leafleet-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.0.0/dist/geosearch.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
  <!--Bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!--Slider (JQuery)-->
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<style>
    body, html{
        height: 100%;
        margin:0;
    }
    body{
        display: flex;
        flex-direction: column;
    }
    header{
        flex: 0 0 auto;
    }
    main{
        flex: 1 1 auto;
        overflow: hidden;
    }
    #map{
        width: 100%;
        height: 100%;
        background: #dcdcdc;
    }
    #map2 img {
        width: 250px;
        height: auto;      
        display: block;
    }
    .left-panel{
        height: 100%;
        background: #f8f9fa;
        border-right: 1px solid #ddd;
    }
    .main-row{
        height: 100%;
    }
    .ui-slider-horizontal .ui-slider-range {
	top: 0;
	height: 100%;
	background-color: rgb(107,192,255)
    }
</style>
</head>
<body>
  
<header class="container-fluid">
  <div class="row">
    <div class="col-sm-4 p-3 bg-primary text-white">
        <h1>Murcia Sísmica</h1>
    </div>
    <div class="col-sm-8 p-3 bg-dark text-white">
        <input type="button" class="btn btn-success float-end" value="Iniciar Sesión">
    </div>
  </div>
</header>

<main class="container-fluid">
  <div class="row main-row">
    <div class="col-12 col-md-4 col-lg-3 left-panel p-3">
            <h5>Información</h5>
            <ul>
                <li>Leyenda</li>
                <li>Num habitantes</li>
                <li>Info Terremotos</li>
            </ul>

            <h5>Filtros</h5>
            <ul>
                <li>Capa Base</li>
                <li>Población</li>
                <li>Terremotos</li>
            </ul>
            <h5>Magnitud del terremoto</h5>
            <div id="sliderMag"></div>
            <span id="spanMag">5 - 7</span>
            <h5>Año del terremoto</h5>
            <div id="sliderAño"></div>
            <span id="spanAño">1980-2025</span>
    </div>
    <div class="col-12 col-md-8 col-lg-9 p-0">
        <div id="map"></div>
    </div>
  </div>  
</main>

</body>

<script>
document.addEventListener("DOMContentLoaded", function() {
    let map;
    let capaTerremotos;      // capa Leaflet
    let datosTerremotos = null; // GeoJSON en memoria

    //Valores Iniciales
    let minMag = 3;
    let maxMag = 5;
    let minAño = 1980;
    let maxAño = 2025;

    // MAPA PRINCIPAL
    function muestra_mapa() {
        map = L.map('map').setView([37.9833, -1.13027], 9);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const search = new GeoSearch.GeoSearchControl({
            provider: new GeoSearch.OpenStreetMapProvider(),
        });
        map.addControl(search);
    }
    muestra_mapa();

    // CREAR LA CAPA
    capaTerremotos = L.geoJSON(null, {
        pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
                radius: 4 + (feature.properties.magnitud || 0),
                color: "red",
                fillColor: "orange",
                fillOpacity: 0.7
            });
        }
    }).addTo(map);

    // APLICAR FILTRO SOBRE LOS DATOS
   function aplicarFiltro() {
    if (!datosTerremotos) return;
    capaTerremotos.clearLayers();
    const filtrados = datosTerremotos.features.filter(f => {
        const m = f.properties.magnitud;
        const año = Number(f.properties.fecha.split("/")[2]);
        return (
            m !== null &&
            m >= minMag && m <= maxMag &&
            año >= minAño && año <= maxAño
        );
    });

    capaTerremotos.addData(filtrados);
}


    // CARGA CAPA TERREMOTOS
    $.getJSON("TerremotosMurcia_1980-2025.geojson", function(data) {
        datosTerremotos = data;
        aplicarFiltro();
    });

    // SLIDER
    $("#sliderMag").slider({
        range: true,
        min: 1,
        max: 8,
        step: 0.1,
        values: [minMag, maxMag],
        values: [3, 5],
        slide: function(event, ui) {
            minMag = ui.values[0];
            maxMag = ui.values[1];
            $("#spanMag").html(minMag + " - " + maxMag);
            aplicarFiltro();
        }
    });

    $("#sliderAño").slider({
        range: true,
        min: 1980,
        max: 2025,
        step: 1,
        values: [1980, 2025],
        slide: function(event, ui) {
            minAño = ui.values[0];
            maxAño = ui.values[1];
            $("#spanAño").html(minAño + " - " + maxAño);
            aplicarFiltro();
        }
    });
});
</script>

</html>
