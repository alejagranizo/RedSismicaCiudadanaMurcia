<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>RSC Murcia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/index.css">

</head>
<body>

    <header class="header-form">
        <div style="display:flex; align-items:center; gap:12px;">
            <a href="index.html" class="home-link" title="Inicio">
                <img src="images/casa.png" alt="Inicio" style="width:24px; height:24px;">
            </a>
            <h1>Red Sismica Ciudadana (Murcia)</h1>
        </div>
        <div id="headerUsuario"></div>
    </header>

    <main class="contenido-login">
        <div class="tarjeta-form" style="text-align:center;">

            <div style="font-size:3rem; margin-bottom:12px;">✅</div>
            <h2 style="color:#2e7d32; margin-bottom:8px;">Terremoto registrado con éxito</h2>
            <p style="color:#555; font-size:0.95rem; margin-bottom:28px;">Tu registro ha sido guardado correctamente.</p>

            <div class="botones-usuario">
                <a href="registrarTerremotos.html" class="btn btn-verde" style="width:70%;">
                    Registrar otro terremoto
                </a>
                <a href="MisRegistros.html" class="btn btn-azul" style="width:70%;">
                    Ir a mis registros
                </a>
                <a href="Visor.html" class="btn btn-oscuro" style="width:70%;">
                    Ir al Visor
                </a>
            </div>

        </div>
    </main>

    <script>
        const usuarioId     = sessionStorage.getItem('usuarioId');
        const usuarioNombre = sessionStorage.getItem('usuarioNombre');

        if (usuarioId) {
            document.getElementById('headerUsuario').innerHTML = `
                <div class="usuario-wrapper">
                    <button class="usuario-btn" onclick="toggleDropdown(event)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                        ${usuarioNombre}
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="MiCuenta.html">Mi cuenta</a>
                        <a href="MisRegistros.html">Mis registros</a>
                        <button class="cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>
                    </div>
                </div>`;
        } else {
            document.getElementById('headerUsuario').innerHTML = `<a class="login" href="login.html">Iniciar sesión</a>`;
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('open');
        }
        document.addEventListener('click', () => {
            document.getElementById('dropdownMenu')?.classList.remove('open');
        });
        async function cerrarSesion() {
            try { await fetch('/users/logout', { method: 'POST', credentials: 'include' }); } catch(_) {}
            sessionStorage.removeItem('usuarioId');
            sessionStorage.removeItem('usuarioNombre');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
