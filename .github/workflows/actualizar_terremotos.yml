name: Actualizar terremotos IGN

on:
  schedule:
    - cron: '0 0 * * 1'   # Cada lunes a las 00:00 UTC
  workflow_dispatch:        # También permite lanzarlo manualmente desde GitHub

jobs:
  descargar-y-actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install geopandas shapely playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar script de descarga
        run: python descarga.py

      - name: Commit y push del GeoJSON actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terremotos_murcia.geojson
          git diff --cached --quiet || git commit -m "chore: actualizar terremotos_murcia.geojson [$(date -u '+%Y-%m-%d')]"
          git push
