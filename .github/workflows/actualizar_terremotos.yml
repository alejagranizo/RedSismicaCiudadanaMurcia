name: Actualizar terremotos IGN

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  descargar-y-actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install geopandas shapely playwright fiona
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar script de descarga
        run: |
          cd public/descargar_terremotos
          python descarga.py

      - name: Subir screenshots de debug si hubo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-ign
          path: public/descargar_terremotos/debug_ign/
          if-no-files-found: ignore

      - name: Commit y push del GeoJSON actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/descargar_terremotos/terremotos_murcia.geojson
          git diff --cached --quiet || git commit -m "chore: actualizar terremotos_murcia.geojson [$(date -u '+%Y-%m-%d')]"
          git push